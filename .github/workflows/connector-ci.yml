name: AEVONE Connector and Worker CI
on:
  pull_request:
    paths:
      - 'web/registry.json'
      - 'web/registry.mjs'
      - 'web/lead.mjs'
      - 'web/brain.mjs'
      - 'web/supabase-rest.mjs'
      - 'web/geography.mjs'
      - 'web/states-by-country.mjs'
      - 'web/cities-from-user-pdf.mjs'
      - 'web/styles.css'
      - 'web/app.js'
      - 'supabase/functions/aevone-dispatch/**'
      - 'supabase/functions/aevone-brain/**'
      - 'tools/**'
      - '.github/workflows/research.yml'
      - 'tests/**'
      - 'backend/**'
      - '.github/workflows/connector-ci.yml'
  push:
    branches: [main]
    paths:
      - 'web/registry.json'
      - 'web/registry.mjs'
      - 'web/lead.mjs'
      - 'web/brain.mjs'
      - 'web/supabase-rest.mjs'
      - 'web/app.js'
      - 'supabase/functions/aevone-dispatch/**'
      - 'supabase/functions/aevone-brain/**'
      - 'tools/**'
      - '.github/workflows/research.yml'
      - 'tests/**'
      - 'backend/**'
      - '.github/workflows/connector-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-connector-and-worker-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned free OSM snapshot parser
        run: python -m pip install --disable-pip-version-check 'osmium==4.3.2'
      - name: Install pinned ISO country catalogue
        run: python -m pip install --disable-pip-version-check 'pycountry==24.6.1'
      - name: Python syntax compilation
        run: python -m compileall -q backend tools tests
      - name: Offline connector registry and existing research worker unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: AI Brain free-provider fallback regression
        run: |
          node --check web/brain.mjs
          node --check web/supabase-rest.mjs
          node --check supabase/functions/aevone-brain/core.mjs
          node tests/brain_fallback_test.mjs
      - name: Lead workspace JavaScript syntax
        run: |
          node --check web/lead.mjs
          node --check web/app.js
      - name: Worldwide targeting and instant dispatch browser-model tests
        run: |
          node --check web/geography.mjs
          node --check web/states-by-country.mjs
          node --check web/cities-from-user-pdf.mjs
          node --check tests/geography_ui_test.mjs
          node tests/geography_ui_test.mjs
      - name: Node.js module import smoke test
        run: |
          node --input-type=module -e "import('./web/registry.mjs').then(m => { if (!Array.isArray(m.default) || m.default.length !== 61) process.exit(1); console.log('JS registry entries:', m.default.length); })"
